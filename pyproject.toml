[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailang-pure"
version = "1.8.0"
description = "AILang compiler (Python-hosted active implementation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
llvm = ["llvmlite==0.49.0"]
dev = [
  "black==26.5.1",
  "isort==9.0.1",
  "ruff==0.16.6",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pylint==4.0.8",
  "bandit==1.9.4",
  "radon==6.0.1",
  "vulture==2.16",
  "pip-audit==2.10.1",
  "detect-secrets==1.5.0",
  "pyflakes==3.4.0",
  "cohesion==1.2.0",
]

[project.scripts]
ailangc = "cli.main:main"

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py311"]

# Golden Gate must not inherit Ruff's evolving default rule set.  Formatting,
# import ordering, typing, security and deeper structural checks are enforced
# independently by Black, isort, mypy, pyflakes, Bandit and AILang's verifier.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "out",
  "archived",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
]
