name: QSP module visibility repair

on:
  push:
    branches: ["agent/qsp-module-visibility-fix"]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qsp-module-visibility-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"
      - name: Apply module visibility repair
        run: |
          python tools/_qsp_module_visibility_patch.py
          python tools/_qsp_module_visibility_extract.py
          python -m black source/compiler/modules.py source/codegen/codegen_module_mixin.py source/transpiler/expr_calls.py source/transpiler/import_resolver.py source/transpiler/import_visibility.py source/diagnostics/diagnostics_engine_symbols.py tests/test_module_visibility.py
          python -m isort source/compiler/modules.py source/codegen/codegen_module_mixin.py source/transpiler/expr_calls.py source/transpiler/import_resolver.py source/transpiler/import_visibility.py source/diagnostics/diagnostics_engine_symbols.py tests/test_module_visibility.py
          test "$(wc -l < source/transpiler/import_resolver.py)" -le 750
      - name: Source strict
        run: python -m verifier.cli -d source --preset strict --check-imports --fail-on-debt -j 0
      - name: QSP regressions
        run: python -m pytest -q tests/test_module_visibility.py tests/test_cross_module_return_inference.py
      - name: Full pytest
        run: python -m pytest -q
      - name: Commit tested repair
        run: |
          git config user.name "Incognitiv"
          git config user.email "2427796+Incognitiv@users.noreply.github.com"
          git rm .github/workflows/qsp-module-visibility-fix.yml tools/_qsp_module_visibility_patch.py tools/_qsp_module_visibility_extract.py
          git add source/compiler/modules.py source/codegen/codegen_module_mixin.py source/transpiler/expr_calls.py source/transpiler/import_resolver.py source/transpiler/import_visibility.py source/diagnostics/diagnostics_engine_symbols.py tests/test_module_visibility.py
          git commit -m "Enforce module visibility across backends"
          git push origin HEAD:agent/qsp-module-visibility-fix
