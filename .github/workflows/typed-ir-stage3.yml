name: Typed IR Frontend Stage 3

on:
  push:
    branches: ["agent/typed-ir-frontend-stage3"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc

      - name: Install AILang verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Normalize staged typed IR sources
        run: |
          python -m black source/ir tests/test_typed_ir_core.py tests/test_typed_ir_frontend.py
          python -m isort source/ir tests/test_typed_ir_core.py tests/test_typed_ir_frontend.py

      - name: Run typed IR frontend regressions
        run: |
          python -m pytest -q tests/test_typed_ir_core.py tests/test_typed_ir_frontend.py tests/test_numeric_join_semantics.py tests/test_type_semantics.py tests/test_return_conversion_contracts.py

      - name: Run source strict verifier
        run: python -m verifier.cli -d source --preset strict

      - name: Run full pytest suite
        run: python -m pytest -q

  lean-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and independently check Lean proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: AILangProof
          axiom-audit: true
          axiom-audit-root: AILangProof
          axiom-audit-allow: propext,Classical.choice,Quot.sound
          use-mathlib-cache: false

      - name: Verify canonical Python Lean conformance
        run: python proof/check_python_conformance.py

  materialize:
    needs: [python-gate, lean-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/typed-ir-frontend-stage3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatting tools
        run: python -m pip install black==26.5.1 isort==9.0.1

      - name: Materialize verified frontend slice
        run: |
          python -m black source/ir tests/test_typed_ir_core.py tests/test_typed_ir_frontend.py
          python -m isort source/ir tests/test_typed_ir_core.py tests/test_typed_ir_frontend.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/ir proof/AILangProof.lean proof/AILangProof/TypedIR.lean tests/test_typed_ir_frontend.py
          git rm .github/workflows/typed-ir-stage3.yml
          git commit -m "Lower validated AILang frontend into typed IR"
          git push origin HEAD:agent/typed-ir-frontend-stage3
