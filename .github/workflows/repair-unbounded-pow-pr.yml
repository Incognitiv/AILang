name: One-shot unbounded pow repair

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/fix-unbounded-pow-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-unbounded-pow-ownership
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,llvm]'
      - name: Apply exact repair
        run: python tools/repair_unbounded_pow_once.py
      - name: Verify focused lanes
        run: |
          python -m py_compile source/codegen/bigint_runtime.py source/transpiler/expr_ops.py source/transpiler/expr_gen_binary_impl.py
          pytest -q tests/test_fast_jit_worker.py
          cat > /tmp/unbounded_pow.ail <<'AIL'
          int main():
              unbounded base = -1
              unbounded exponent = 9223372036854775809
              unbounded result = base ** exponent
              print(result)
              string text = str(result)
              print(text)
              return 0
          end
          AIL
          python ailang.py /tmp/unbounded_pow.ail --backend=llvm -O1 -o /tmp/unbounded_pow_llvm
          test "$(/tmp/unbounded_pow_llvm)" = $'-1\n-1'
          python ailang.py /tmp/unbounded_pow.ail --backend=c -O1 -o /tmp/unbounded_pow_c
          AILANG_LEAK_REPORT=1 /tmp/unbounded_pow_c > /tmp/c.out 2> /tmp/c.err
          test "$(cat /tmp/c.out)" = $'-1\n-1'
          grep -E 'live( at exit)?:[[:space:]]+0( bytes)?' /tmp/c.err
      - name: Commit only repaired sources
        run: |
          git config user.name 'AILang repair gate'
          git config user.email 'actions@users.noreply.github.com'
          git add stdlib/core/bigint.ail source/codegen/bigint_runtime.py source/transpiler/expr_ops.py source/transpiler/expr_gen_binary_impl.py
          git rm -f .github/workflows/repair-unbounded-pow.yml .github/workflows/repair-unbounded-pow-pr.yml tools/repair_unbounded_pow_once.py
          git commit -m 'Fix true unbounded exponentiation across backends'
          git push origin HEAD:agent/fix-unbounded-pow-ownership
