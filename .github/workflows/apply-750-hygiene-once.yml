name: Repair staged 750-line split bindings

on:
  push:
    branches: ["agent/unbounded-field-semantics"]

permissions:
  contents: write

jobs:
  repair-split-bindings:
    if: github.event.head_commit.message == 'Repair split cleanup binding'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair stale cleanup imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('source/transpiler/emit_statements_basic.py')
          text = path.read_text()
          old = 'from .emit_statements_control_data import _emit_stack_class_cleanup'
          new = 'from .emit_statements_cleanup import _emit_stack_class_cleanup'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale cleanup imports, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit mechanical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/transpiler/emit_statements_basic.py
          git diff --cached --check
          git commit -m "Repair cleanup binding after statement split"
          git push origin HEAD:agent/unbounded-field-semantics

      - name: Install AILang and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Import every statement split module
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=source python - <<'PY'
          import importlib
          from pathlib import Path

          for path in sorted(Path('source/transpiler').glob('emit_statements*.py')):
              module = f'transpiler.{path.stem}'
              importlib.import_module(module)
              print(f'{module}: PASS')
          PY

      - name: Instantiate backends
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=source python - <<'PY'
          from transpiler.core import CTranspiler
          from codegen.fast_jit import fast_jit_file
          CTranspiler()
          assert callable(fast_jit_file)
          print('backend import graph: PASS')
          PY

      - name: Verify C string ownership
        run: python -m pytest -q tests/test_c_string_ownership.py tests/test_c_string_ownership_optimizations.py

      - name: Verify complexity and repository hygiene
        run: |
          python -m pytest -q tests/test_complexity_guard.py tests/test_repository_hygiene_audit.py
          python tools/repository_hygiene_audit.py
