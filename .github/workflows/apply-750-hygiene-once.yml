name: Capture range-facts import traceback

on:
  push:
    branches: ["agent/unbounded-field-semantics"]

permissions:
  contents: write

jobs:
  capture-import-traceback:
    if: github.event.head_commit.message == 'Capture range facts import traceback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AILang
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Capture backend import traceback
        shell: bash
        run: |
          set +e
          PYTHONPATH=source python - <<'PY' > .golden-upload/range-facts-import-probe.txt 2>&1
          from transpiler.core import CTranspiler
          from codegen.fast_jit import fast_jit_file
          CTranspiler()
          assert callable(fast_jit_file)
          print('backend import graph: PASS')
          PY
          rc=$?
          echo "import_probe_rc=${rc}" >> .golden-upload/range-facts-import-probe.txt
          exit 0

      - name: Commit traceback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AILang Golden Gate"
          git config user.email "actions@users.noreply.github.com"
          git add .golden-upload/range-facts-import-probe.txt
          git commit -m "Capture range facts import failure"
          git push origin HEAD:agent/unbounded-field-semantics
