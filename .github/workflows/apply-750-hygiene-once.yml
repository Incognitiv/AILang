name: Repair verified 750-line hygiene refactor

on:
  push:
    branches: ["agent/unbounded-field-semantics"]

permissions:
  contents: write

jobs:
  normalize-and-diagnose:
    if: github.event.head_commit.message == 'Repair 750 refactor strict contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 061754bca1773fc43f79e4359ef3f69fee2d17da HEAD
          cat \
            .golden-upload/xz00p-00.txt \
            .golden-upload/xz00p-01.txt \
            .golden-upload/xz00p-02.txt \
            .golden-upload/xz00p-03.txt \
            .golden-upload/xz8-01.txt \
            .golden-upload/rem12-00.txt \
            .golden-upload/rem12-01.txt \
            .golden-upload/rem12-02.txt \
            .golden-upload/rem12-03.txt \
            .golden-upload/rem12-04.txt \
            .golden-upload/rem12-05.txt \
            .golden-upload/rem12-06.txt \
            .golden-upload/rem12-07.txt \
            .golden-upload/rem12-08.txt > /tmp/refactor.b64
          echo "3a92445d0220ab2da950435477ee2380f4e69d9e7705bea456886c2c461d447b  /tmp/refactor.b64" | sha256sum -c -
          base64 -d /tmp/refactor.b64 > /tmp/refactor.patch.xz
          xz -dc /tmp/refactor.patch.xz > /tmp/refactor.patch
          echo "775222c4324959829edc5abd17cb9e601b86aa71e3f1bcd23ed55da9a140fcb4  /tmp/refactor.patch" | sha256sum -c -
          git apply --check /tmp/refactor.patch
          git apply /tmp/refactor.patch

      - name: Apply semantic split repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          field_file = Path('source/transpiler/stmt_visit_data_fields.py')
          text = field_file.read_text()
          old = 'from .stmt_visit_data import _emit_dyn_array_push_in_place'
          new = 'from .stmt_visit_assignment_helpers import _emit_dyn_array_push_in_place'
          assert text.count(old) == 1, 'unexpected dyn-array import state'
          field_file.write_text(text.replace(old, new))

          mixins = {
              'source/transpiler/helper_scanner_detail_mixin.py': 12,
              'source/transpiler/expr_ops_binary_mixin.py': 5,
              'source/transpiler/expr_calls_object_mixin.py': 9,
              'source/transpiler/prologue_header_mixin.py': 1,
              'source/codegen/builtin_string_conversion_mixin.py': 9,
              'source/transpiler/expr_gen_concurrency_mixin.py': 3,
              'source/codegen/codegen_template_support_mixin.py': 1,
              'source/transpiler/expr_builtin_sql_column_mixin.py': 2,
          }
          pattern = re.compile(r'(\bdef\s+[A-Za-z_]\w*\(\s*)self(?=[,\)])')
          for filename, expected in mixins.items():
              path = Path(filename)
              source = path.read_text()
              source, count = pattern.subn(r'\1self: Any', source)
              assert count == expected, f'{filename}: expected {expected} self annotations, got {count}'
              ast.parse(source)
              path.write_text(source)

          type_helpers = Path('source/transpiler/expr_type_helpers.py')
          text = type_helpers.read_text()
          if '\nimport sys\n' not in text:
              marker = 'from __future__ import annotations\n'
              assert marker in text
              text = text.replace(marker, marker + '\nimport sys\n', 1)
          type_helpers.write_text(text)

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text()
          black_block = '[tool.black]\nline-length = 88\n'
          assert black_block in text
          text = text.replace(
              black_block,
              black_block + 'target-version = ["py311"]\n',
              1,
          )
          pyproject.write_text(text)
          PY
          PYTHONPATH=source python - <<'PY'
          import transpiler.core
          import codegen.fast_jit
          print('core import smoke: PASS')
          PY

      - name: Install deterministic verification stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Apply safe mechanical normalization
        shell: bash
        run: |
          set -euo pipefail
          isort source verifier
          black source verifier
          ruff check --fix source verifier || true
          isort source verifier
          black source verifier

      - name: Verify normalization did not change contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q source verifier tools benchmarks tests
          python tools/public_tree_audit.py
          python tools/repository_hygiene_audit.py
          python -m pytest -q \
            tests/test_complexity_guard.py \
            tests/test_repository_hygiene_audit.py \
            tests/test_c_string_ownership.py \
            tests/test_c_string_ownership_optimizations.py \
            tests/test_ui_platform.py \
            tests/test_self_host_gate_seed.py

      - name: Show residual Ruff diagnostics
        shell: bash
        continue-on-error: true
        run: ruff check source verifier

      - name: Show standalone typing diagnostics
        shell: bash
        continue-on-error: true
        run: |
          set +e
          for f in \
            source/transpiler/helper_scanner_detail_mixin.py \
            source/transpiler/expr_ops_binary_mixin.py \
            source/transpiler/expr_calls_object_mixin.py \
            source/transpiler/prologue_header_mixin.py \
            source/codegen/builtin_string_conversion_mixin.py \
            source/transpiler/expr_gen_concurrency_mixin.py \
            source/codegen/codegen_template_support_mixin.py \
            source/transpiler/expr_builtin_sql_column_mixin.py \
            source/transpiler/import_resolver.py \
            source/transpiler/emit_statements_basic.py \
            source/parser/return_type_inference.py \
            source/parser/parser_declarations_impl.py \
            source/transpiler/llvm_bigint.py \
            source/cli/version_info.py; do
            echo "===== MYPY $f ====="
            mypy "$f" --show-error-codes --explicit-package-bases --no-pretty --no-error-summary || true
          done

      - name: Run strict verifier after normalization
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python -m verifier.cli -d source --preset strict --check-imports --fail-on-debt -j 0
          echo "SOURCE_STRICT_RC=$?"
          python -m verifier.cli -d verifier --preset strict --check-imports --fail-on-debt -j 0
          echo "VERIFIER_STRICT_RC=$?"

      - name: Commit normalized source for next repair pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AILang Golden Gate"
          git config user.email "actions@users.noreply.github.com"
          git add source verifier tools benchmarks tests stdlib examples pyproject.toml .github/workflows/ailang-hard-gate.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No normalized source changes to commit"
            exit 0
          fi
          git commit -m "Normalize 750-line refactor for strict verifier"
          git push origin HEAD:agent/unbounded-field-semantics
