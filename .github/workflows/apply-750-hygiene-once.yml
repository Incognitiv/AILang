name: Probe staged C ownership

on:
  push:
    branches: ["agent/unbounded-field-semantics"]

permissions:
  contents: write

jobs:
  ownership-probe:
    if: github.event.head_commit.message == 'Probe staged ownership regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AILang and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Capture ownership regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_c_string_ownership.py > /tmp/ownership.log 2>&1
          ownership_rc=$?
          python -m pytest -q tests/test_c_string_ownership_optimizations.py > /tmp/ownership_opt.log 2>&1
          optimizations_rc=$?
          set -e
          {
            echo "ownership_rc=${ownership_rc}"
            echo "optimizations_rc=${optimizations_rc}"
            echo
            echo "===== tests/test_c_string_ownership.py ====="
            cat /tmp/ownership.log
            echo
            echo "===== tests/test_c_string_ownership_optimizations.py ====="
            cat /tmp/ownership_opt.log
          } > .golden-upload/ownership-probe.txt

      - name: Commit probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AILang Golden Gate"
          git config user.email "actions@users.noreply.github.com"
          git add .golden-upload/ownership-probe.txt
          git commit -m "Capture staged ownership regression"
          git push origin HEAD:agent/unbounded-field-semantics
