name: Verify range-facts split repair

on:
  push:
    branches: ["agent/unbounded-field-semantics"]

permissions:
  contents: read

jobs:
  verify-range-facts-repair:
    if: github.event.head_commit.message == 'Restore range facts loop helper'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AILang and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Instantiate C transpiler and JIT imports
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=source python - <<'PY'
          from transpiler.core import CTranspiler
          from codegen.fast_jit import fast_jit_file
          CTranspiler()
          assert callable(fast_jit_file)
          print('backend import graph: PASS')
          PY

      - name: Verify C string ownership
        run: python -m pytest -q tests/test_c_string_ownership.py

      - name: Verify C string ownership optimizations
        run: python -m pytest -q tests/test_c_string_ownership_optimizations.py

      - name: Verify complexity guard
        run: python -m pytest -q tests/test_complexity_guard.py

      - name: Verify repository hygiene
        run: |
          python tools/repository_hygiene_audit.py
          python -m pytest -q tests/test_repository_hygiene_audit.py
