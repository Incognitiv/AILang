name: Diagnose staged 750-line refactor gates

on:
  push:
    branches: ["agent/unbounded-field-semantics"]

permissions:
  contents: read

jobs:
  diagnose-refactor-gates:
    if: github.event.head_commit.message == 'Diagnose split refactor gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AILang and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Import all statement split modules
        run: |
          PYTHONPATH=source python - <<'PY'
          import importlib
          from pathlib import Path
          from transpiler.core import CTranspiler
          from codegen.fast_jit import fast_jit_file

          for path in sorted(Path('source/transpiler').glob('emit_statements*.py')):
              importlib.import_module(f'transpiler.{path.stem}')
          CTranspiler()
          assert callable(fast_jit_file)
          print('statement split/backend graph: PASS')
          PY

      - name: Complexity guard
        continue-on-error: true
        run: python -m pytest -q tests/test_complexity_guard.py

      - name: Repository hygiene unit tests
        continue-on-error: true
        run: python -m pytest -q tests/test_repository_hygiene_audit.py

      - name: Repository hygiene audit
        continue-on-error: true
        run: python tools/repository_hygiene_audit.py

      - name: Ownership regression tests
        continue-on-error: true
        run: python -m pytest -q tests/test_c_string_ownership.py tests/test_c_string_ownership_optimizations.py
