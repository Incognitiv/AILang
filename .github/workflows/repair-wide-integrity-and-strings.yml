name: Repair wide integer integrity and string lifetimes

on:
  push:
    branches:
      - agent/unbounded-field-semantics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install toolchains
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang gcc llvm libsqlite3-dev
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,llvm]'

      - name: Apply repair
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/repair_wide_integrity_and_strings.py')
          s = p.read_text()
          old = '''    "source/transpiler/drop_plan.py",\n    "source/diagnostics/static_analysis_perf.py",\n]:'''
          new = '''    "source/transpiler/drop_plan.py",\n]:'''
          if old not in s:
              raise SystemExit('generic metadata list anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('DefinitelyNotAType', 'definitely_not_a_type')
          p.write_text(s)
          PY
          python .github/scripts/repair_wide_integrity_and_strings.py
          python .github/scripts/repair_i128_fixed_boundaries.py
          python -m py_compile \
            source/codegen/type_lowering.py \
            source/codegen/builtin_string.py \
            source/transpiler/core_type_lowering.py \
            source/transpiler/expr_threading_core.py \
            source/transpiler/expr_call_dispatch.py \
            source/transpiler/expr_gen_call_builtin_map.py \
            source/transpiler/expr_gen_call_impl.py \
            source/transpiler/expr_gen_basic_impl.py \
            source/transpiler/stmt_visit_calls.py \
            source/transpiler/stmt_visit_data.py \
            source/transpiler/helper_scanner.py \
            source/transpiler/runtime_emitter.py \
            source/transpiler/runtime_emit_string.py \
            source/transpiler/runtime_emit_fixed_int_casts.py \
            source/diagnostics/static_analysis_perf.py

      - name: Focused representation tests
        run: |
          set -euxo pipefail
          pytest -q tests/test_fixed_wide_representation_integrity.py

      - name: Compile and inspect real fixed-wide values
        run: |
          set -euxo pipefail
          cat > /tmp/wide_integrity.ail <<'AIL'
          i128 add128(i128 a, i128 b):
              return a + b
          end
          i256 add256(i256 a, i256 b):
              return a + b
          end
          i512 add512(i512 a, i512 b):
              return a + b
          end
          def main(): int
              i128 a = 1267650600228229401496703205376
              i128 b = 7
              i128 c = add128(a, b)
              u128 u = 1267650600228229401496703205385
              i256 x = 1606938044258990275541962092341162602522202993782792835301376
              i256 y = 11
              i256 z = add256(x, y)
              i512 p = 13
              i512 q = 17
              i512 r = add512(p, q)
              print(str(c))
              print(str(u))
              print(hex(c))
              print(bin(c))
              print(oct(c))
              print("c={c}")
              print(str(z))
              print(str(r))
              return 0
          end
          AIL

          python ailang.py /tmp/wide_integrity.ail --backend=llvm --native-toolchain=clang --no-prepass -O2 -o /tmp/wide_llvm
          /tmp/wide_llvm > /tmp/wide_llvm.out
          LL=$(find out/generated/llvm_aot -name 'wide_integrity_*.ll' -print -quit)
          test -n "$LL"
          grep -Eq 'define .*i128.*add128|add i128' "$LL"
          grep -Eq 'define .*i256.*add256|add i256' "$LL"
          grep -Eq 'define .*i512.*add512|add i512' "$LL"
          ! grep -Eq 'trunc i(128|256|512) .* to i64' "$LL"

          python ailang.py /tmp/wide_integrity.ail --backend=c -O2 -o /tmp/wide_c
          /tmp/wide_c > /tmp/wide_c.out
          diff -u /tmp/wide_llvm.out /tmp/wide_c.out
          CFILE=$(find out/generated/c_backend -name 'wide_integrity_*.c' -print -quit)
          test -n "$CFILE"
          grep -q '__int128' "$CFILE"
          grep -q 'ailang_str_i128' "$CFILE"
          grep -q 'ailang_hex_i128' "$CFILE"
          grep -Eq '_BitInt\(256\)|ailang_i256' "$CFILE"
          grep -Eq '_BitInt\(512\)|ailang_i512' "$CFILE"

      - name: Check i128 dynamic-array boundary
        run: |
          set -euxo pipefail
          cat > /tmp/i128_array_boundary.ail <<'AIL'
          def main(): int
              arr = array_new(1)
              i128 x = 1267650600228229401496703205376
              arr = array_push(arr, x)
              return 0
          end
          AIL
          python ailang.py /tmp/i128_array_boundary.ail --backend=c -O1 -o /tmp/i128_array_boundary
          set +e
          /tmp/i128_array_boundary > /tmp/i128_array.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'does not fit signed 64-bit boundary' /tmp/i128_array.out

      - name: Compile and run one-allocation JSON escape
        run: |
          set -euxo pipefail
          cat > /tmp/json_escape.ail <<'AIL'
          def main(): int
              source = "quote=\" slash=\\ newline=\n tab=\t"
              escaped = str_escape_json(source)
              print(escaped)
              return 0
          end
          AIL
          python ailang.py /tmp/json_escape.ail --backend=llvm --native-toolchain=clang --no-prepass -O2 -o /tmp/json_escape_llvm
          /tmp/json_escape_llvm > /tmp/json_escape_llvm.out
          python ailang.py /tmp/json_escape.ail --backend=c -O2 -o /tmp/json_escape_c
          /tmp/json_escape_c > /tmp/json_escape_c.out
          diff -u /tmp/json_escape_llvm.out /tmp/json_escape_c.out
          grep -F 'quote=\" slash=\\ newline=\n tab=\t' /tmp/json_escape_llvm.out

      - name: Static ownership diagnostic gate
        run: |
          set -euxo pipefail
          cat > /tmp/owned_push.ail <<'AIL'
          def main(): int
              parts = str_array_new(4)
              parts = str_array_push(parts, chr(65))
              return str_array_len(parts)
          end
          AIL
          python ailang.py /tmp/owned_push.ail --check 2>&1 | tee /tmp/owned_push.check || true
          grep -q 'OWNERSHIP LEAK' /tmp/owned_push.check

      - name: Commit repaired branch and self-remove
        run: |
          set -euxo pipefail
          rm .github/workflows/repair-wide-integrity-and-strings.yml
          rm .github/scripts/repair_wide_integrity_and_strings.py
          rm .github/scripts/repair_i128_fixed_boundaries.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Enforce wide integer integrity and string ownership'
          git push origin HEAD:agent/unbounded-field-semantics
