name: AILang Golden Gate

on:
  push:
    branches: ["main", "master", "agent/unbounded-field-semantics"]
  pull_request:
  workflow_dispatch:

jobs:
  golden-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc

      - name: Install AILang and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Run Golden Gate
        run: python tools/golden_gate.py

      - name: Upload Golden Gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ailang-golden-gate-reports
          path: |
            out/golden_gate/golden_gate_current.json
            out/golden_gate/golden_gate_current.md
            out/golden_gate/backend_differential.json
            out/golden_gate/backend_differential.md
            out/golden_gate/execution_matrix.json
            out/golden_gate/execution_matrix.md
            benchmarks/results/tri_language_gauntlet.json
            benchmarks/results/tri_language_gauntlet.md
