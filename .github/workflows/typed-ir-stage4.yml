name: Typed IR Certificate Stage 4

on:
  push:
    branches: ["agent/typed-ir-certificate-stage4"]
  workflow_dispatch:

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc

      - name: Install AILang verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Check typed IR certificate Python surface
        run: |
          python -m black --check source/ir tests/test_typed_ir_certificate.py proof/check_ir_certificate.py
          python -m isort --diff --check-only source/ir tests/test_typed_ir_certificate.py proof/check_ir_certificate.py
          python -m pytest -q tests/test_typed_ir_core.py tests/test_typed_ir_frontend.py tests/test_typed_ir_certificate.py tests/test_numeric_join_semantics.py tests/test_type_semantics.py tests/test_return_conversion_contracts.py

      - name: Run source strict verifier
        run: python -m verifier.cli -d source --preset strict

      - name: Run full pytest suite
        run: python -m pytest -q

  lean-certificate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and independently check Lean proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: AILangProof
          nanoda: false
          axiom-audit: true
          axiom-audit-root: AILangProof
          axiom-audit-allow: propext,Classical.choice,Quot.sound
          use-mathlib-cache: false

      - name: Verify existing Python Lean conformance
        run: python proof/check_python_conformance.py

      - name: Verify real Typed IR certificates with Lean
        run: python proof/check_ir_certificate.py
