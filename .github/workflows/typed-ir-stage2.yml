name: Typed IR Core Stage 2

on:
  push:
    branches: ["agent/typed-ir-core-stage2"]
  workflow_dispatch:

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc

      - name: Install AILang verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Run typed IR regressions
        run: |
          python -m pytest -q tests/test_typed_ir_core.py tests/test_numeric_join_semantics.py tests/test_type_semantics.py tests/test_return_conversion_contracts.py

      - name: Run source strict verifier
        run: python -m verifier.cli -d source --preset strict

      - name: Run full pytest suite
        run: python -m pytest -q
