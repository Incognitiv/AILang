name: Patch FreeBSD local prefix

on:
  push:
    branches: [agent/unbounded-field-semantics]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - name: Add FreeBSD local include/library search paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/cli/compilation.py')
          text = path.read_text(encoding='utf-8')

          old = '''    link_flags = _merge_link_flags(explicit_link_flags, ["-lm"], auto_link_flags)\n    include_dirs = collect_cinclude_include_dirs(source_file)\n'''
          new = '''    platform_compile_flags: list[str] = []\n    platform_link_flags: list[str] = []\n    if os_from_platform() == "freebsd":\n        # FreeBSD Ports installs third-party headers/libraries under\n        # /usr/local. The base-system clang intentionally does not search\n        # this prefix automatically, so ports-provided dependencies such as\n        # sqlite3 require explicit search paths.\n        if Path("/usr/local/include").is_dir():\n            platform_compile_flags.append("-I/usr/local/include")\n        if Path("/usr/local/lib").is_dir():\n            platform_link_flags.append("-L/usr/local/lib")\n    link_flags = _merge_link_flags(\n        explicit_link_flags, ["-lm"], platform_link_flags, auto_link_flags\n    )\n    include_dirs = collect_cinclude_include_dirs(source_file)\n'''
          if old not in text:
              raise SystemExit('compile_via_c insertion point not found')
          text = text.replace(old, new, 1)

          old = '''            *pgo_flags,\n            *(f"-I{include_dir}" for include_dir in include_dirs),\n            str(c_file),\n'''
          new = '''            *pgo_flags,\n            *platform_compile_flags,\n            *(f"-I{include_dir}" for include_dir in include_dirs),\n            str(c_file),\n'''
          if old not in text:
              raise SystemExit('compiler argv insertion point not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_freebsd_c_backend_prefix.py')
          test.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\n\ndef test_freebsd_local_prefix_is_wired_into_c_backend():\n    text = Path("source/cli/compilation.py").read_text(encoding="utf-8")\n    assert 'os_from_platform() == "freebsd"' in text\n    assert 'platform_compile_flags.append("-I/usr/local/include")' in text\n    assert 'platform_link_flags.append("-L/usr/local/lib")' in text\n    assert '*platform_compile_flags' in text\n''', encoding='utf-8')
          PY

      - name: Verify and self-remove
        shell: bash
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_freebsd_c_backend_prefix.py tests/test_llvm_sqlite_link_flags.py tests/test_link_directives.py
          rm -f .github/workflows/patch-freebsd-local-prefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Teach C backend FreeBSD local prefix"
          git push origin HEAD:agent/unbounded-field-semantics
