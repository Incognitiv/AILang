name: Validate LLVM request arena lifetime repair

on:
  push:
    branches:
      - agent/unbounded-field-semantics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          python -m pip install -e '.[dev,llvm]'

      - name: Apply LLVM request arena repair
        run: |
          set -euxo pipefail
          python .github/scripts/repair_llvm_request_arena.py
          python -m py_compile source/codegen/codegen_function_mixin.py source/codegen/codegen_support_mixin.py source/codegen/builtin_string.py tests/test_arena_routing_llvm.py
          git diff --check

      - name: Focused LLVM arena tests
        run: |
          set -euxo pipefail
          pytest -q tests/test_arena_routing_llvm.py tests/test_arena_runtime_safety.py

      - name: Relevant regression suites
        run: |
          set -euxo pipefail
          pytest -q tests/test_format_strlen_budget.py tests/test_fixed_wide_representation_integrity.py tests/test_llvm_wide_ints.py

      - name: Commit repair and self-remove harness
        run: |
          set -euxo pipefail
          rm .github/workflows/validate-llvm-request-arena.yml
          rm .github/scripts/repair_llvm_request_arena.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Make LLVM request arena cross-function safe'
          git push origin HEAD:agent/unbounded-field-semantics
