name: Source Strict Repair

on:
  push:
    branches:
      - agent/unbounded-field-semantics

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact source repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "source/transpiler/emit_statements_basic.py",
              "def visit_VarDecl(self, node: VarDecl):\n    llvm_type = self.codegen.get_llvm_type(node.type_name)",
              "def visit_VarDecl(self, node: VarDecl):\n    init_value: ir.Value | None\n    llvm_type = self.codegen.get_llvm_type(node.type_name)",
          )
          replace_once(
              "source/transpiler/expr_type_helpers.py",
              "            if isinstance(value.type, ir.IntType) and target_unsigned is not None:\n",
              "            if (\n                isinstance(value.type, ir.IntType)\n                and isinstance(target_type, ir.IntType)\n                and target_unsigned is not None\n            ):\n",
          )
          replace_once(
              "source/parser/return_type_inference.py",
              "        return _join(b, a)\n",
              "        return _join(a=b, b=a)\n",
          )
          PY
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev,llvm]"
      - name: Verify repaired source files
        shell: bash
        run: |
          python -m verifier.cli source/transpiler/emit_statements_basic.py --preset strict --check-imports
          python -m verifier.cli source/transpiler/expr_type_helpers.py --preset strict --check-imports
          python -m verifier.cli source/parser/return_type_inference.py --preset strict --check-imports
      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/test_fixed_wide_representation_integrity.py tests/test_type_parsing_p8_data_model.py
      - name: Commit repaired source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/source-strict-diagnostic.yml
          git config user.name "Incognitiv"
          git config user.email "2427796+Incognitiv@users.noreply.github.com"
          git add source/transpiler/emit_statements_basic.py \
                  source/transpiler/expr_type_helpers.py \
                  source/parser/return_type_inference.py \
                  .github/workflows/source-strict-diagnostic.yml
          git diff --cached --check
          git commit -m "Close source strict Golden Gate blockers"
          git push origin HEAD:agent/unbounded-field-semantics
