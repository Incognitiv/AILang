name: Source Strict Diagnostic

on:
  push:
    branches:
      - agent/unbounded-field-semantics

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic tools
        run: python -m pip install mypy==2.3.1 bandit==1.9.4 detect-secrets==1.5.0
      - name: Show exact mypy diagnostics
        shell: bash
        run: |
          export MYPYPATH="$PWD/typings:$PWD/source:$PWD:$PWD/tests"
          set +e
          mypy source/transpiler/emit_statements_basic.py \
            --show-error-codes --explicit-package-bases --no-pretty --no-error-summary
          mypy source/transpiler/expr_type_helpers.py \
            --show-error-codes --explicit-package-bases --no-pretty --no-error-summary
          exit 0
      - name: Show score-only diagnostics
        shell: bash
        run: |
          bandit -f json -q --exit-zero source/parser/return_type_inference.py || true
          detect-secrets scan source/parser/return_type_inference.py || true
