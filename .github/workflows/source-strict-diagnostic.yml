name: Source Strict Diagnostic

on:
  push:
    branches:
      - agent/unbounded-field-semantics

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev,llvm]"
      - name: Show exact mypy diagnostics
        shell: bash
        run: |
          export MYPYPATH="$PWD/typings:$PWD/source:$PWD:$PWD/tests"
          set +e
          mypy source/transpiler/emit_statements_basic.py \
            --show-error-codes --explicit-package-bases --no-pretty --no-error-summary
          mypy source/transpiler/expr_type_helpers.py \
            --show-error-codes --explicit-package-bases --no-pretty --no-error-summary
          exit 0
      - name: Show exact verifier result
        shell: bash
        run: |
          python -m verifier.cli source/parser/return_type_inference.py \
            --preset strict --check-imports --json --exit-zero
