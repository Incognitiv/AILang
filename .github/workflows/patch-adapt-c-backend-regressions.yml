name: Patch ADAPT C backend regressions

on:
  push:
    branches: [agent/unbounded-field-semantics]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - name: Patch C backend regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_s, old, new):
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'insertion point not found in {path_s}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) FreeBSD does not expose INADDR_LOOPBACK under every strict
          # feature-visibility combination. The numeric IPv4 loopback value is
          # standardized and htonl() keeps host/network byte order correct.
          replace_once(
              'source/transpiler/runtime_emit_sockets.py',
              '    emitter._output.append("    addr.sin_addr.s_addr = htonl(INADDR_LOOPBACK);")\n',
              '    emitter._output.append("    addr.sin_addr.s_addr = htonl(0x7F000001UL);")\n',
          )

          # 2) Preserve the collector's function-local C type map during emit.
          # It already exists specifically to avoid cross-function var-name
          # pollution; pointer-vs-value expression lowering must consult it too.
          replace_once(
              'source/transpiler/stmt_visit_class.py',
              '    self._collect_vars_in_body(node.body, all_vars)\n    self._current_param_type_overrides = apply_proven_i32_narrowing(\n',
              '    self._collect_vars_in_body(node.body, all_vars)\n    self._current_local_c_types = dict(all_vars)\n    self._current_param_type_overrides = apply_proven_i32_narrowing(\n',
          )
          replace_once(
              'source/transpiler/stmt_visit_class.py',
              '    self._current_param_type_overrides = {}\n    # Reset unchecked mode and synchronized state after function\n',
              '    self._current_param_type_overrides = {}\n    self._current_local_c_types = {}\n    # Reset unchecked mode and synchronized state after function\n',
          )
          replace_once(
              'source/transpiler/stmt_visit_class_method.py',
              '    all_vars: Dict[str, str] = {}\n    self._collect_vars_in_body(method.body, all_vars)\n\n    # Build parameter list with self pointer first\n',
              '    all_vars: Dict[str, str] = {}\n    self._collect_vars_in_body(method.body, all_vars)\n    self._current_local_c_types = dict(all_vars)\n\n    # Build parameter list with self pointer first\n',
          )
          replace_once(
              'source/transpiler/stmt_visit_class_method.py',
              '    self._current_ret_spec = None\n',
              '    self._current_ret_spec = None\n    self._current_local_c_types = {}\n',
          )
          replace_once(
              'source/transpiler/core_cleanup_reports.py',
              '    def _class_ptr_type(self: Any, node: A.ASTNode) -> Optional[str]:\n        return self.type_info.class_ptr_type(node, self._current_class)\n',
              '''    def _class_ptr_type(self: Any, node: A.ASTNode) -> Optional[str]:\n        # Prefer the current function/method declaration map. TypeInfo.var_types\n        # is intentionally legacy-global and can be polluted when unrelated\n        # functions reuse a short local name such as `c` or `n`.\n        if isinstance(node, A.Variable):\n            local_type = getattr(self, "_current_local_c_types", {}).get(node.name)\n            if isinstance(local_type, str):\n                c_type = local_type.strip()\n                if c_type in self.classes:\n                    return c_type\n                if c_type.endswith("*"):\n                    base = c_type[:-1].strip()\n                    if base in self.classes:\n                        return base\n        return self.type_info.class_ptr_type(node, self._current_class)\n''',
          )

          # 3) `array = 0` is the language's empty/default sentinel. C lowers
          # array to a struct, so integer 0LL is not assignable. Emit a zeroed
          # compound literal for struct-valued collection fields.
          old = '''        if checked_expr is not None:\n            init_expr = checked_expr\n        self.emit_raw(f"    __t->{field_name} = {init_expr};")\n'''
          new = '''        if checked_expr is not None:\n            init_expr = checked_expr\n        field_type_text = parsed_type_to_str(field_type).strip().lower()\n        if (\n            field_type_text in {"array", "str_array", "stringarray", "intarray"}\n            and isinstance(init_value, A.Number)\n            and not isinstance(init_value.value, float)\n            and int(init_value.value) == 0\n        ):\n            init_expr = f"({self._ailang_type_to_c(parsed_type_to_str(field_type))}){{0}}"\n        self.emit_raw(f"    __t->{field_name} = {init_expr};")\n'''
          replace_once('source/transpiler/stmt_visit_class.py', old, new)

          old = '''        if checked_default is not None:\n            default_expr = checked_default\n        self.emit(f"  {storage}.{field_name} = {default_expr};")\n'''
          new = '''        if checked_default is not None:\n            default_expr = checked_default\n        field_type_text = parsed_type_to_str(field_type).strip().lower()\n        if (\n            field_type_text in {"array", "str_array", "stringarray", "intarray"}\n            and isinstance(default_node, A.Number)\n            and not isinstance(default_node.value, float)\n            and int(default_node.value) == 0\n        ):\n            default_expr = f"({self._ailang_type_to_c(parsed_type_to_str(field_type))}){{0}}"\n        self.emit(f"  {storage}.{field_name} = {default_expr};")\n'''
          replace_once('source/transpiler/stmt_visit_data.py', old, new)
          PY

      - name: Verify regression surface
        shell: bash
        run: |
          python3 -m compileall -q source/transpiler

          cat >/tmp/adapt_codegen_regression.ail <<'EOF'
          class Cell:
              public int value = 0
              public def init(v: int):
                  this.value = v
              end
          end

          class Snapshot:
              public array cells = 0
              public def init(source: array):
                  this.cells = array_new(1)
                  c = as_class(array_get(source, 0), Cell)
                  this.cells = array_push(this.cells, new Cell(c.value))
              end
          end

          def main(): int
              source = array_new(1)
              source = array_push(source, new Cell(7))
              snap = new Snapshot(source)
              return array_len(snap.cells) - 1
          end
          EOF

          python3 ailang.py /tmp/adapt_codegen_regression.ail --backend=c -O1 -o /tmp/adapt_codegen_regression
          /tmp/adapt_codegen_regression

          grep -q 'htonl(0x7F000001UL)' source/transpiler/runtime_emit_sockets.py

          rm -f .github/workflows/patch-adapt-c-backend-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix C backend class defaults and local pointer typing"
          git push origin HEAD:agent/unbounded-field-semantics
