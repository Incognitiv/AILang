name: Validate wide integers and string ownership

on:
  push:
    branches:
      - agent/unbounded-field-semantics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang gcc llvm libsqlite3-dev
          python -m pip install -e '.[dev,llvm]'
      - name: Apply ownership candidate
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('source/transpiler/strlen_assign_cache.py')
          s = p.read_text(encoding='utf-8')
          anchor = 'def strlen_cache_var_name(var_name: str) -> str:\n    return f"__ailang_strlen_{var_name}"\n\n\n'
          insert = '''def strlen_cache_var_name(var_name: str) -> str:\n    return f"__ailang_strlen_{var_name}"\n\n\ndef _emission_type_map(emitter: Any) -> Dict[str, str]:\n    """Use the same function-local type facts during analysis and emission."""\n    local_types = getattr(emitter, "_current_local_c_types", None)\n    if isinstance(local_types, dict) and local_types:\n        return local_types\n    fallback = getattr(emitter, "_var_types", None)\n    return fallback if isinstance(fallback, dict) else {}\n\n\n'''
          if anchor not in s:
              raise SystemExit('strlen type-map insertion anchor missing')
          s = s.replace(anchor, insert, 1)
          s = s.replace('    value_arg = str_known_integer_arg(emitter, value)\n', '    type_map = _emission_type_map(emitter)\n    value_arg = str_known_integer_arg(emitter, value, type_map)\n', 1)
          s = s.replace('    base_arg = baseconv_known_integer_arg(emitter, value)\n', '    base_arg = baseconv_known_integer_arg(emitter, value, type_map)\n', 1)
          s = s.replace('    if interpolation_known_length(emitter, value, getattr(emitter, "_var_types", {})):\n', '    if interpolation_known_length(emitter, value, type_map):\n', 1)
          old = '''    return is_length_only_string_producer(\n        emitter, value, getattr(emitter, "_var_types", {})\n    )\n'''
          new = '''    return is_length_only_string_producer(\n        emitter, value, _emission_type_map(emitter)\n    )\n'''
          if old not in s:
              raise SystemExit('length-only emission anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('source/transpiler/expr_gen.py')
          s = p.read_text(encoding='utf-8')
          old = '''        dynamic_len = emit_dynamic_strlen_c(self, node)\n        if dynamic_len is not None:\n            return dynamic_len\n        virtual_len = self._emit_virtual_strlen(node)\n        if virtual_len is not None:\n            return virtual_len\n'''
          new = '''        # Prefer the allocation-free numeric specialization before the\n        # generic dynamic planner. Hidden string-length arguments must not\n        # materialize str(i) merely to measure it.\n        virtual_len = self._emit_virtual_strlen(node)\n        if virtual_len is not None:\n            return virtual_len\n        dynamic_len = emit_dynamic_strlen_c(self, node)\n        if dynamic_len is not None:\n            return dynamic_len\n'''
          if old not in s:
              raise SystemExit('known strlen ordering anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile source/transpiler/strlen_assign_cache.py source/transpiler/expr_gen.py
      - name: Target class-loop ownership regression
        run: |
          set -euxo pipefail
          pytest -q tests/test_c_string_ownership.py::test_c_backend_cleans_redeclared_class_local_in_loop
          f="$(ls -t out/generated/c_backend/loop_redecl_class_*.c | head -1)"
          grep -n 'Packet_init(&__ailang_stack_p' "$f"
          if grep -q 'ailang_strlen(ailang_int_to_str(i))' "$f"; then
            echo 'hidden length still allocates str(i)' >&2
            exit 1
          fi
          grep -q 'ailang_i64_decimal_len(i)' "$f"
