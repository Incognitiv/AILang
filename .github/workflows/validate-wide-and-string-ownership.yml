name: Validate wide integers and string ownership

on:
  push:
    branches:
      - agent/unbounded-field-semantics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test toolchains
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang gcc llvm libsqlite3-dev
          python -m pip install -e '.[dev,llvm]'

      - name: Apply candidate repairs
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('source/transpiler/core_type_lowering.py')
          s = p.read_text(encoding='utf-8')
          old = '            "bool": "bool",\n            "string": "const char *",\n'
          new = '            "bool": "bool",\n            "i1": "bool",  # parser canonical spelling for AILang bool\n            "string": "const char *",\n'
          if old not in s:
              raise SystemExit('bool type-map anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('source/cli/compilation.py')
          s = p.read_text(encoding='utf-8')
          old = 'CBACKEND_COMPILE_TIMEOUT_SECONDS = 60\n'
          if old not in s:
              raise SystemExit('C backend timeout anchor missing')
          p.write_text(s.replace(old, 'CBACKEND_COMPILE_TIMEOUT_SECONDS = 180\n', 1), encoding='utf-8')

          p = Path('source/transpiler/strlen_assign_cache.py')
          s = p.read_text(encoding='utf-8')
          anchor = 'def strlen_cache_var_name(var_name: str) -> str:\n    return f"__ailang_strlen_{var_name}"\n\n\n'
          insert = '''def strlen_cache_var_name(var_name: str) -> str:\n    return f"__ailang_strlen_{var_name}"\n\n\ndef _emission_type_map(emitter: Any) -> Dict[str, str]:\n    """Use the same function-local type facts during analysis and emission."""\n    local_types = getattr(emitter, "_current_local_c_types", None)\n    if isinstance(local_types, dict) and local_types:\n        return local_types\n    fallback = getattr(emitter, "_var_types", None)\n    return fallback if isinstance(fallback, dict) else {}\n\n\n'''
          if anchor not in s:
              raise SystemExit('strlen type-map insertion anchor missing')
          s = s.replace(anchor, insert, 1)
          s = s.replace('    value_arg = str_known_integer_arg(emitter, value)\n', '    type_map = _emission_type_map(emitter)\n    value_arg = str_known_integer_arg(emitter, value, type_map)\n', 1)
          s = s.replace('    base_arg = baseconv_known_integer_arg(emitter, value)\n', '    base_arg = baseconv_known_integer_arg(emitter, value, type_map)\n', 1)
          s = s.replace('    if interpolation_known_length(emitter, value, getattr(emitter, "_var_types", {})):\n', '    if interpolation_known_length(emitter, value, type_map):\n', 1)
          old = '''    return is_length_only_string_producer(\n        emitter, value, getattr(emitter, "_var_types", {})\n    )\n'''
          new = '''    return is_length_only_string_producer(\n        emitter, value, _emission_type_map(emitter)\n    )\n'''
          if old not in s:
              raise SystemExit('length-only emission anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('source/transpiler/drop_plan.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if coerced == DropKind.OWNED_STRING:\n        checker = is_owned_string_alloc or _default_owned_string_alloc\n        return bool(checker(expr))\n'''
          new = '''    if coerced == DropKind.OWNED_STRING:\n        if isinstance(expr, A.BinaryOp) and expr.op.lower() in {"+", "plus"}:\n            return True\n        checker = is_owned_string_alloc or _default_owned_string_alloc\n        return bool(checker(expr))\n'''
          if old not in s:
              raise SystemExit('owned string drop-plan anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Target remaining ownership regression and dump C on failure
        run: |
          set -euxo pipefail
          if pytest -q tests/test_c_string_ownership.py::test_c_backend_cleans_redeclared_class_local_in_loop; then
            exit 0
          fi
          f="$(ls -t out/generated/c_backend/loop_redecl_class_*.c | head -1)"
          echo "=== GENERATED: $f ==="
          echo '=== Packet init/new/destructor ==='
          grep -n -E 'Packet_(init|new|destructor)|__owned_|__ailang_stack_p|ailang_strcat|while \(' "$f" | tail -n 160 || true
          echo '=== main body ==='
          main_line="$(grep -n '^int main' "$f" | head -1 | cut -d: -f1)"
          if [ -n "$main_line" ]; then
            start=$((main_line > 10 ? main_line - 10 : 1))
            end=$((main_line + 100))
            sed -n "${start},${end}p" "$f"
          fi
          exit 1

      - name: C fixed wide and unbounded integers
        run: |
          pytest -q tests/test_c_wide_ints.py

      - name: LLVM fixed wide and unbounded integers
        run: |
          pytest -q tests/test_llvm_wide_ints.py

      - name: C string ownership
        run: |
          pytest -q tests/test_c_string_ownership.py

      - name: Representation integrity regression
        run: |
          pytest -q tests/test_fixed_wide_representation_integrity.py
