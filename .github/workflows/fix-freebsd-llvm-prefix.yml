name: Fix FreeBSD LLVM linker prefix
on:
  push:
    branches: [agent/unbounded-field-semantics]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
      - name: Patch LLVM FreeBSD library prefix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/cli/compilation.py')
          s = p.read_text()
          old = '''    auto_link_flags = _detect_llvm_link_flags(_ll_src)\n    link_flags = _merge_link_flags(explicit_link_flags, ["-lm"], auto_link_flags)\n'''
          new = '''    auto_link_flags = _detect_llvm_link_flags(_ll_src)\n    platform_link_flags: list[str] = []\n    if os_from_platform() == "freebsd" and Path("/usr/local/lib").is_dir():\n        # FreeBSD Ports libraries are outside the base-system clang search path.\n        platform_link_flags.append("-L/usr/local/lib")\n    link_flags = _merge_link_flags(\n        explicit_link_flags, ["-lm"], platform_link_flags, auto_link_flags\n    )\n'''
          assert old in s, 'LLVM link flag block changed unexpectedly'
          p.write_text(s.replace(old, new, 1))
          PY
          python3 -m py_compile source/cli/compilation.py
          grep -q 'platform_link_flags.append("-L/usr/local/lib")' source/cli/compilation.py
          rm .github/workflows/fix-freebsd-llvm-prefix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Teach LLVM AOT FreeBSD local library prefix'
          git push origin HEAD:agent/unbounded-field-semantics
