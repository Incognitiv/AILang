name: Apply Golden Gate repair once

on:
  push:
    branches: ["agent/unbounded-field-semantics"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - name: Apply staged repair
        run: |
          set -euxo pipefail
          test -d .golden-repair
          for repair in .golden-repair/*.patch; do
            echo "Applying ${repair}"
            patch -p1 --batch < "${repair}"
          done
          rm -rf .golden-repair
          rm -f .github/workflows/golden-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Establish AILang Golden Gate"
          git push origin HEAD:agent/unbounded-field-semantics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc rustc

      - name: Install AILang verification stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Run Golden Gate on repaired tree
        run: python tools/golden_gate.py

      - name: Upload Golden Gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-repair-reports
          path: |
            out/golden_gate/**
            benchmarks/results/tri_language_gauntlet.json
            benchmarks/results/tri_language_gauntlet.md
          if-no-files-found: warn
