name: Normalize Golden Gate strict debt once

on:
  push:
    branches: ["agent/unbounded-field-semantics"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llvm]"

      - name: Apply portability and correctness fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (Path("source"), Path("tools"), Path("tests"))
          for root in roots:
              for path in root.rglob("*.py"):
                  text = path.read_text(encoding="utf-8")
                  updated = text.replace("-std=gnu23", "-std=gnu2x")
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          path = Path("source/transpiler/stmt_visit_control.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''    if isinstance(node, A.Call) and node.name in {"split_str_get", "str_array_get"}:\n        if node.args and isinstance(node.args[0], A.Variable):\n            owner_name = node.args[0].name\n''',
              '''    if isinstance(node, A.Call) and node.name in {"split_str_get", "str_array_get"}:\n        if node.args:\n            first_arg, *_remaining_args = node.args\n            if isinstance(first_arg, A.Variable):\n                owner_name = first_arg.name\n''',
          )
          text = text.replace(
              '''        for entry in getattr(self, attr, None) or []:\n            cleanup_names.add(entry[0] if isinstance(entry, tuple) else entry)\n''',
              '''        for entry in getattr(self, attr, None) or []:\n            if isinstance(entry, tuple):\n                entry_name, *_entry_metadata = entry\n                cleanup_names.add(entry_name)\n            else:\n                cleanup_names.add(entry)\n''',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("source/diagnostics/static_analysis_perf.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''    if isinstance(node, A.Call) and node.name == "str_array_push" and len(node.args) >= 2:\n        value = node.args[1]\n        if _owned_string_expr(value):\n''',
              '''    if isinstance(node, A.Call) and node.name == "str_array_push" and len(node.args) >= 2:\n        _container, value, *_extra_args = node.args\n        if _owned_string_expr(value):\n''',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("source/transpiler/prologue_emitter.py")
          text = path.read_text(encoding="utf-8")
          needle = '''        self._output.append("    #ifndef SIZE_MAX")\n        self._output.append("        #define SIZE_MAX ((size_t)-1)")\n        self._output.append("    #endif")\n'''
          addition = needle + '''        self._output.append("    #ifndef offsetof")\n        self._output.append("        #if defined(__GNUC__) || defined(__clang__)")\n        self._output.append("            #define offsetof(type, member) __builtin_offsetof(type, member)")\n        self._output.append("        #else")\n        self._output.append("            #define offsetof(type, member) ((size_t)&(((type *)0)->member))")\n        self._output.append("        #endif")\n        self._output.append("    #endif")\n'''
          if "#define offsetof(type, member) __builtin_offsetof" not in text:
              if needle not in text:
                  raise SystemExit("freestanding offsetof insertion point missing")
              text = text.replace(needle, addition, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Normalize source and verifier
        run: |
          python -m isort source verifier
          python -m black source verifier
          python -m ruff check --fix source verifier || true
          python -m isort source verifier
          python -m black source verifier

      - name: Commit normalized tree
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source verifier tools tests
          git diff --cached --check
          git commit -m "Normalize Golden Gate strict and C23 portability"
          git push origin HEAD:agent/unbounded-field-semantics

      - name: Verify strict source
        run: python -m verifier.cli -d source --preset strict --check-imports --fail-on-debt -j 0
        continue-on-error: true

      - name: Verify strict verifier
        run: python -m verifier.cli -d verifier --preset strict --check-imports --fail-on-debt -j 0
        continue-on-error: true

      - name: Verify prior failing regressions
        run: |
          python -m pytest -q \
            tests/test_cabi_header_blocks.py \
            tests/test_cbind_probe.py \
            tests/test_cimport_bindings.py \
            tests/test_export_symbol_alias.py \
            tests/test_ffi_layout_probe.py \
            tests/test_header_generation.py \
            tests/test_ui_platform.py
          python tools/c_strict_compile.py --std c2x --freestanding --generated 6
