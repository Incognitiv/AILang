name: AILang Lean Proof

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native toolchains and AILang backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc
          python -m pip install -e ".[llvm]"

      - name: Build and independently check Lean proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: AILangProof
          axiom-audit: true
          axiom-audit-root: AILangProof
          axiom-audit-allow: propext,Classical.choice,Quot.sound
          use-mathlib-cache: false

      - name: Run AILang proof-model report
        working-directory: proof
        run: lake exe ailangProofReport

      - name: Verify Python/Lean semantic conformance
        run: python proof/check_python_conformance.py

      - name: Verify real Typed IR certificates with Lean
        run: python proof/check_ir_certificate.py

      - name: Prove actual frontend and executable literal observations
        run: python proof/check_literal_semantics.py

      - name: Upload semantic proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ailang-semantic-proof-evidence
          path: |
            out/proof_semantics/literal_semantics.json
            out/proof_semantics/*.lean
            out/proof_semantics/*.log
            out/proof_semantics/*-stdout.txt
            out/proof_semantics/literal_semantics.ail
          if-no-files-found: warn
