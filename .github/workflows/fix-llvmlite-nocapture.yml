name: Fix llvmlite nocapture compatibility
on:
  push:
    branches: [agent/unbounded-field-semantics]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
      - name: Patch and verify
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -q llvmlite
          python3 - <<'PY'
          from pathlib import Path

          p = Path('source/codegen/codegen_module_mixin.py')
          s = p.read_text()
          old = '''                if type_str in ("string", "str"):\n                    func.args[i].add_attribute("noalias")\n                    func.args[i].add_attribute("nocapture")\n                    func.args[i].add_attribute("nonnull")\n                # Other pointers are just nocapture (don't escape)\n                else:\n                    func.args[i].add_attribute("nocapture")\n'''
          new = '''                if type_str in ("string", "str"):\n                    func.args[i].add_attribute("noalias")\n                    # llvmlite 0.49 no longer accepts nocapture through the\n                    # high-level ArgumentAttributes API. It is an optimization\n                    # hint only, so retain the semantic attributes and omit it.\n                    func.args[i].add_attribute("nonnull")\n                else:\n                    pass\n'''
          assert old in s, 'module nocapture block changed unexpectedly'
          p.write_text(s.replace(old, new, 1))

          p = Path('source/codegen/codegen_function_mixin.py')
          s = p.read_text()
          old = '''                for arg in self.func.args:\n                    if isinstance(arg.type, ir.PointerType):\n                        arg.add_attribute("noalias")\n                        arg.add_attribute("nocapture")\n'''
          new = '''                for arg in self.func.args:\n                    if isinstance(arg.type, ir.PointerType):\n                        arg.add_attribute("noalias")\n'''
          assert old in s, 'function nocapture block changed unexpectedly'
          p.write_text(s.replace(old, new, 1))
          PY
          python3 -m py_compile source/codegen/codegen_module_mixin.py source/codegen/codegen_function_mixin.py
          cat >/tmp/nocapture.ail <<'AIL'
          def echo(s: string): string
              return s
          end
          def main(): int
              print echo("ok")
              return 0
          end
          AIL
          python3 ailang.py /tmp/nocapture.ail --backend=llvm --native-toolchain=clang --no-prepass -O2 -o /tmp/nocapture
          /tmp/nocapture | grep -q ok
          rm .github/workflows/fix-llvmlite-nocapture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Tolerate llvmlite nocapture API removal'
          git push origin HEAD:agent/unbounded-field-semantics
