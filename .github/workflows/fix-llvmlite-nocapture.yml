name: Fix llvmlite nocapture compatibility
on:
  push:
    branches: [agent/unbounded-field-semantics]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unbounded-field-semantics
      - name: Patch and verify
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -q llvmlite
          python3 - <<'PY'
          from pathlib import Path
          edits = {
              'source/codegen/codegen_module_mixin.py': [
                  ('                    func.args[i].add_attribute("nocapture")\n',
                   '                    try:\n                        func.args[i].add_attribute("nocapture")\n                    except ValueError:\n                        # llvmlite 0.49 removed nocapture from the high-level\n                        # ArgumentAttributes allow-list. It is an optimizer hint,\n                        # not a semantic requirement, so compile without it.\n                        pass\n'),
                  ('                    func.args[i].add_attribute("nocapture")\n',
                   '                    try:\n                        func.args[i].add_attribute("nocapture")\n                    except ValueError:\n                        pass\n'),
              ],
              'source/codegen/codegen_function_mixin.py': [
                  ('                        arg.add_attribute("nocapture")\n',
                   '                        try:\n                            arg.add_attribute("nocapture")\n                        except ValueError:\n                            pass\n'),
              ],
          }
          for name, replacements in edits.items():
              p = Path(name)
              s = p.read_text()
              for old, new in replacements:
                  assert old in s, f'missing expected nocapture site in {name}'
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          python3 -m py_compile source/codegen/codegen_module_mixin.py source/codegen/codegen_function_mixin.py
          cat >/tmp/nocapture.ail <<'AIL'
          def echo(s: string): string
              return s
          end
          def main(): int
              print echo("ok")
              return 0
          end
          AIL
          python3 ailang.py /tmp/nocapture.ail --backend=llvm --native-toolchain=clang --no-prepass -O2 -o /tmp/nocapture
          /tmp/nocapture | grep -q ok
          rm .github/workflows/fix-llvmlite-nocapture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Tolerate llvmlite nocapture API removal'
          git push origin HEAD:agent/unbounded-field-semantics
